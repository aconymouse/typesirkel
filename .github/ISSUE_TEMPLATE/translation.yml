name: Translation
description: Fix a translation, or offer to add a language.
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Japanese, or Indonesian
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What to change or add
      description: Paste the current text and your suggestion, or tell us which pages you'd like to translate.
    validations:
      required: true
