[package]
name = "typesirkel"
version = "0.1.0"
description = "A quiet markdown editor for people who write in folders."
authors = ["Hafidz Nc"]
license = "MIT"
repository = "https://github.com/aconymouse/typesirkel"
edition = "2021"
rust-version = "1.88"

[lib]
name = "typesirkel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde_json = "1"
keyring = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
